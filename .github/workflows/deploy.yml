
name: Deploy All Post Reads to GitHub Pages

on:
  push:
    branches:
      - 'post-read-*'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch All Branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Prepare Deployment Directory
        run: mkdir -p site
      
      - name: Collect Available Post Reads
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..12}
          do
            BRANCH="post-read-$i"

            COMMIT=$(git rev-parse --verify \
              "refs/remotes/origin/$BRANCH^{commit}" 2>/dev/null || true)

            if [ -n "$COMMIT" ]; then
              echo "Collecting $BRANCH ($COMMIT)"

              mkdir -p "site/$BRANCH"

              git archive "$COMMIT" | tar -x -C "site/$BRANCH"

            else
              echo "Skipping $BRANCH - branch does not exist"
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
